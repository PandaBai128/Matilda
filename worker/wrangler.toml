name = "clicky-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
MINIMAX_CHAT_MODEL = "MiniMax-M3.1-Flash"
MINIMAX_THINKING_TYPE = "adaptive"
MINIMAX_REASONING_EFFORT = "low"
MINIMAX_MAX_TOKENS = "8192"
MINIMAX_POINTING_MODE = "custom"
MINIMAX_POINTING_PRECISION = "raw"
MINIMAX_TTS_MODEL = "speech-2.8-turbo"
MINIMAX_TTS_VOICE_ID = "Chinese (Mandarin)_Warm_Bestie"
MINIMAX_TTS_VOLUME = "1.0"
TENCENT_ASR_ENGINE_MODEL_TYPE = "16k_zh_en"
